<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Signup Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-top: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .signup {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .result-row strong {
            color: #333;
        }

        .back {
            margin-top: 25px;
            padding: 12px 20px;
            border: none;
            background: #555;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        @media(max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container" id="formPage">

    <h1>Create Your Account</h1>
    <p class="subtitle">Secure Registration Portal — Demo</p>

    <form id="signupForm">

        <!-- PERSONAL INFORMATION -->
        <div class="section">
            <h2>Personal Information</h2>

            <div class="grid">

                <div class="field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="First Name"
                           placeholder="Enter first name" required>
                </div>

                <div class="field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="Last Name"
                           placeholder="Enter last name" required>
                </div>

                <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="Date of Birth" required>
                </div>

                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" name="Gender" required>
                        <option value="">Select gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" name="Mobile Number"
                           placeholder="Enter mobile number" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email"
                           placeholder="example@email.com" required>
                </div>

            </div>
        </div>


        <!-- IDENTITY INFORMATION -->
        <div class="section">
            <h2>Identity Information</h2>

            <div class="grid">

                <div class="field">
                    <label for="aadhaar">Aadhaar Number</label>
                    <input type="text" id="aadhaar" name="Aadhaar Number"
                           placeholder="XXXX XXXX XXXX"
                           maxlength="14">
                </div>

                <div class="field">
                    <label for="pan">PAN Number</label>
                    <input type="text" id="pan" name="PAN Number"
                           placeholder="ABCDE1234F"
                           maxlength="10">
                </div>

                <div class="field">
                    <label for="passport">Passport Number</label>
                    <input type="text" id="passport" name="Passport Number"
                           placeholder="Enter passport number">
                </div>

                <div class="field">
                    <label for="voter">Voter ID</label>
                    <input type="text" id="voter" name="Voter ID"
                           placeholder="Enter voter ID">
                </div>

                <div class="field">
                    <label for="driving">Driving License</label>
                    <input type="text" id="driving" name="Driving License"
                           placeholder="Enter driving license">
                </div>

            </div>
        </div>


        <!-- ACCOUNT SECURITY -->
        <div class="section">
            <h2>Account & Security</h2>

            <div class="grid">

                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="Username"
                           placeholder="Choose username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="Password"
                           placeholder="Enter password" required>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           name="Confirm Password"
                           placeholder="Confirm password" required>
                </div>

                <div class="field">
                    <label for="otp">OTP</label>
                    <input type="text" id="otp" name="OTP"
                           placeholder="Enter 6-digit OTP"
                           maxlength="6">
                </div>

                <div class="field">
                    <label for="pin">Security PIN</label>
                    <input type="password" id="pin" name="Security PIN"
                           placeholder="Enter 4-digit PIN"
                           maxlength="4">
                </div>

                <div class="field">
                    <label for="securityCode">Security Code</label>
                    <input type="text" id="securityCode"
                           name="Security Code"
                           placeholder="Enter security code">
                </div>

            </div>
        </div>


        <!-- ADDRESS -->
        <div class="section">
            <h2>Address Information</h2>

            <div class="grid">

                <div class="field full">
                    <label for="address">Full Address</label>
                    <textarea id="address"
                              name="Full Address"
                              placeholder="Enter your address"></textarea>
                </div>

                <div class="field">
                    <label for="city">City</label>
                    <input type="text" id="city" name="City"
                           placeholder="Enter city">
                </div>

                <div class="field">
                    <label for="state">State</label>
                    <select id="state" name="State">
                        <option value="">Select state</option>
                        <option>Andhra Pradesh</option>
                        <option>Telangana</option>
                        <option>Karnataka</option>
                        <option>Tamil Nadu</option>
                        <option>Maharashtra</option>
                        <option>Delhi</option>
                        <option>Kerala</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="pincode">PIN Code</label>
                    <input type="text" id="pincode" name="PIN Code"
                           placeholder="Enter PIN code"
                           maxlength="6">
                </div>

                <div class="field">
                    <label for="country">Country</label>
                    <input type="text" id="country" name="Country"
                           value="India">
                </div>

            </div>
        </div>


        <!-- OTHER -->
        <div class="section">
            <h2>Additional Information</h2>

            <div class="grid">

                <div class="field">
                    <label for="employeeId">Employee / Student ID</label>
                    <input type="text" id="employeeId"
                           name="Employee / Student ID"
                           placeholder="Enter ID">
                </div>

                <div class="field">
                    <label for="referral">Referral Code</label>
                    <input type="text" id="referral"
                           name="Referral Code"
                           placeholder="Enter referral code">
                </div>

            </div>
        </div>


        <button type="submit" class="signup">
            Sign Up
        </button>

    </form>

</div>


<!-- DETAILS PAGE -->
<div class="container" id="detailsPage" style="display:none;">

    <h1>Registration Successful</h1>

    <p class="subtitle">
        Here are the details entered during registration.
    </p>

    <div class="result" id="details"></div>

    <button class="back" onclick="goBack()">
        ← Back to Registration
    </button>

</div>


<script>

    const form = document.getElementById("signupForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const formData = new FormData(form);

        const detailsContainer = document.getElementById("details");

        detailsContainer.innerHTML = "";

        formData.forEach((value, key) => {

            const row = document.createElement("div");

            row.className = "result-row";

            const label = document.createElement("strong");
            label.textContent = key;

            const valueElement = document.createElement("span");

            // Display password-like fields as entered
            valueElement.textContent = value || "(Not entered)";

            row.appendChild(label);
            row.appendChild(valueElement);

            detailsContainer.appendChild(row);
        });

        document.getElementById("formPage").style.display = "none";
        document.getElementById("detailsPage").style.display = "block";

        window.scrollTo(0, 0);
    });


    function goBack() {

        document.getElementById("detailsPage").style.display = "none";
        document.getElementById("formPage").style.display = "block";

        window.scrollTo(0, 0);
    }

</script>

</body>
</html>
